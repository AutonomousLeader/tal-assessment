  aria-label="The Autonomous Leader — brand mark">

  <!-- TAL Brand Mark -->
  <!-- Segmented Starburst · 9 blades · 7 levels -->
  <!-- Blade taper: 4° inner → 16° outer -->
  <!-- Geometry: 9 blades at 40° intervals, 7 ring segments per blade -->
  <!-- Colors: dark teal (L1 core) → bright teal (L7 tip) -->
  <!-- viewBox: 0 0 100 100 · scale freely to any size -->

  <title>The Autonomous Leader — Brand Mark</title>
  <desc>
    A 9-blade segmented starburst representing the TAL 9 P's × 7 Levels framework.
    Each blade corresponds to one P; each ring segment corresponds to one Level (1–7).
    Full mark (all segments filled) represents complete leadership mastery.
  </desc>
  
